# C generated source: single-file C form of the C API, refreshed on
# every master push and committed back to c/generated/.
# The checked-in ramzara.c is the portable, no-V-toolchain-needed form
# of capi/ramzara_c.v (same flags as the C-lib release build).
# The [skip ci] trailer on the refresh commit keeps this workflow from
# triggering itself; c/generated/ is covered by .gitattributes as
# generated code — never edit it by hand.
name: C generated source

on:
  push:
    branches: [master]
    paths:
      - '**.v'
      - 'c/ramzara.h'
      - 'c/ramzara.def'
      - 'c/demo.c'
      - '.github/workflows/c-generated.yml'

concurrency:
  group: c-generated-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    name: generate C source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build pinned V
        uses: ./.github/actions/build-v-pinned
      - name: Install package into .vmodules
        shell: bash
        run: |
          mkdir -p ~/.vmodules/metif12
          cp -r "$GITHUB_WORKSPACE" ~/.vmodules/metif12/ramzara
          rm -rf ~/.vmodules/metif12/ramzara/.git
      - name: Generate C source
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/c/generated"
          cd ~/.vmodules/metif12/ramzara
          "$VBIN" -Wimpure-v -enable-globals -shared -o "$GITHUB_WORKSPACE/c/generated/ramzara.c" capi/ramzara_c.v
          ls -la "$GITHUB_WORKSPACE/c/generated/ramzara.c"
          grep -c '^RAMZARA_\|ramzara_dial\|ramzara_version' "$GITHUB_WORKSPACE/c/generated/ramzara.c"
      - name: Commit back
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add c/generated/ramzara.c
          if git diff --cached --quiet; then
            echo "generated C unchanged"
            exit 0
          fi
          git commit -m "chore(c): refresh generated C source [skip ci]"
          git pull --rebase
          git push
