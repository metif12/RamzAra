# CI: fmt gate, full test matrix, OpenSSL interop.
#
# The package needs a V toolchain newer than 0.5.2 (it uses
# x.crypto.mldsa/mlkem-era stdlib APIs), so CI builds V from source at a
# pinned commit (cached). Bump V_PIN when the sync base moves.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  V_PIN: bf074d87e6bd4206c8967fcf18b10004e7c85716

jobs:
  fmt:
    name: fmt clean
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned V
        uses: ./.github/actions/build-v-pinned
      - name: Check formatting
        run: |
          files=$(find tls tls12 dtls12 x509 pkcs12 slh_dsa rsa kat mlkem toolkit cmd capi -name '*.v')
          "$VBIN" fmt -l $files

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned V
        uses: ./.github/actions/build-v-pinned
      - name: Install package into .vmodules
        shell: bash
        run: |
          mkdir -p ~/.vmodules/metif12
          cp -r "$GITHUB_WORKSPACE" ~/.vmodules/metif12/ramzara
          rm -rf ~/.vmodules/metif12/ramzara/.git
      - name: Run full suite
        shell: bash
        run: |
          # VJOBS=2: the suite is heavy pure-V crypto (SLH-DSA, ML-DSA);
          # 4 parallel test binaries starved the loopback handshakes and
          # produced timeout flakes on windows/macos runners.
          export VJOBS=2
          "$VBIN" -Wimpure-v -enable-globals -silent test \
            ~/.vmodules/metif12/ramzara/tls \
            ~/.vmodules/metif12/ramzara/tls12 \
            ~/.vmodules/metif12/ramzara/dtls12 \
            ~/.vmodules/metif12/ramzara/x509 \
            ~/.vmodules/metif12/ramzara/pkcs12 \
            ~/.vmodules/metif12/ramzara/slh_dsa \
            ~/.vmodules/metif12/ramzara/rsa \
            ~/.vmodules/metif12/ramzara/kat \
            ~/.vmodules/metif12/ramzara/mlkem \
            ~/.vmodules/metif12/ramzara/toolkit

  openssl-interop:
    name: openssl interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Git bash on Windows rewrites `/CN=...` to a filesystem path
      # (MSYS path conversion); the req -subj flag needs it verbatim.
      MSYS_NO_PATHCONV: 1
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned V
        uses: ./.github/actions/build-v-pinned
      - name: Set up OpenSSL
        shell: bash
        run: |
          openssl version
          mkdir -p ~/.vmodules/metif12
          cp -r "$GITHUB_WORKSPACE" ~/.vmodules/metif12/ramzara
          rm -rf ~/.vmodules/metif12/ramzara/.git
      - name: Build the CLI
        shell: bash
        run: '"$VBIN" -Wimpure-v -enable-globals -o "$GITHUB_WORKSPACE/ramzara-bin" "$GITHUB_WORKSPACE/cmd/ramzara"'
      - name: ramzara req + openssl verify
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/ramzara-bin" req -newkey ec:p-256 -keyout k.pem -out c.pem -subj /CN=localhost -days 30
          openssl x509 -in c.pem -noout -subject
          "$GITHUB_WORKSPACE/ramzara-bin" verify -CAfile c.pem c.pem -hostname localhost
      - name: ramzara s_server vs openssl s_client
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/ramzara-bin" s_server -accept 18443 -cert c.pem -key k.pem -naccept 1 &
          SRV=$!
          sleep 2
          printf 'ping' | openssl s_client -connect 127.0.0.1:18443 -CAfile c.pem -quiet
          wait $SRV
      - name: openssl s_server vs ramzara s_client
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          # Close s_server's stdin: OpenSSL 3.x quits on stdin EOF and the
          # step stdin is not guaranteed open (ACCEPT then instant DONE, 0
          # accepts). A pipe (`sleep 30 |`) holds Unix stdin open but makes
          # Windows Git-bash openssl deaf (0 accepts for 30s: MSYS2/native
          # pipe boundary). A closed fd serves fine on both (proven vs 3.0
          # and 3.5.6 with real handshakes), so close it outright.
          openssl s_server -tls1_3 -accept 18444 -cert c.pem -key k.pem -naccept 1 <&- &
          SRV=$!
          sleep 2
          # -servername: our client verifies the hostname against the
          # dialed host (like Go); the cert is for localhost, not the
          # 127.0.0.1 we connect to. (openssl s_client skips this check
          # unless -verify_hostname is given.)
          printf 'ping' | "$GITHUB_WORKSPACE/ramzara-bin" s_client -connect 127.0.0.1:18444 -servername localhost -CAfile c.pem -brief
          wait $SRV

  c-api:
    name: C API shared lib (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            out: libramzara.so
          - os: windows-latest
            out: ramzara.dll
          - os: macos-latest
            out: libramzara.dylib
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned V
        uses: ./.github/actions/build-v-pinned
      - name: Install package into .vmodules
        shell: bash
        run: |
          mkdir -p ~/.vmodules/metif12
          cp -r "$GITHUB_WORKSPACE" ~/.vmodules/metif12/ramzara
          rm -rf ~/.vmodules/metif12/ramzara/.git
      - name: Build shared library
        shell: bash
        run: |
          cd ~/.vmodules/metif12/ramzara
          if [ "${{ runner.os }}" = "Windows" ]; then
            "$VBIN" -Wimpure-v -enable-globals -shared -cflags "-Wl,--export-all-symbols" -o "$GITHUB_WORKSPACE/${{ matrix.out }}" capi/ramzara_c.v
            dlltool -d c/ramzara.def --dllname "${{ matrix.out }}" -l "$GITHUB_WORKSPACE/libramzara.dll.a"
          else
            "$VBIN" -Wimpure-v -enable-globals -shared -o "$GITHUB_WORKSPACE/${{ matrix.out }}" capi/ramzara_c.v
          fi
          ls -la "$GITHUB_WORKSPACE/${{ matrix.out }}"
      - name: Verify C exports
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            objdump -p "$GITHUB_WORKSPACE/${{ matrix.out }}" | grep -E 'ramzara_(dial|read|write|close|verify|cert_text|last_error|version)'
          elif [ "${{ runner.os }}" = "macOS" ]; then
            nm -g "$GITHUB_WORKSPACE/${{ matrix.out }}" | grep -E 'ramzara_(dial|read|write|close|verify|cert_text|last_error|version)'
          else
            nm -D --defined-only "$GITHUB_WORKSPACE/${{ matrix.out }}" | grep -E 'ramzara_(dial|read|write|close|verify|cert_text|last_error|version)'
          fi
