# Builds V from source at $V_PIN and caches the binary.
# Usage: uses: ./.github/actions/build-v-pinned
name: build-v-pinned
description: Build the pinned V toolchain (cached)

runs:
  using: composite
  steps:
    - name: Cache V checkout
      id: vcache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vlang
        key: vlang-${{ env.V_PIN }}-${{ runner.os }}
    - name: Clone V
      if: steps.vcache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone https://github.com/vlang/v "$GITHUB_WORKSPACE/vlang"
        cd "$GITHUB_WORKSPACE/vlang"
        git checkout "$V_PIN"
    - name: Build V
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE/vlang"
        if [ -x ./v -o -x ./v.exe ]; then ./v --version 2>/dev/null || ./v.exe --version || true; fi
        if [ ! -x ./v ] && [ ! -x ./v.exe ]; then
          if [ "${{ runner.os }}" = "Windows" ]; then ./makev.bat; else make; fi
        fi
        if [ -x ./v ]; then ./v --version; else ./v.exe --version; fi
